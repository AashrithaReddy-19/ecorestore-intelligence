services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecorestore
      POSTGRES_PASSWORD: ecorestore
      POSTGRES_DB: ecorestore
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecorestore"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://ecorestore:ecorestore@db:5432/ecorestore
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      CHROMA_PERSIST_DIRECTORY: /app/knowledge_base/chroma_store
      ENVIRONMENT: docker
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - chroma_data:/app/knowledge_base/chroma_store

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-8000}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  db_data:
  chroma_data:
